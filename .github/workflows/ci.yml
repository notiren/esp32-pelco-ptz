name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Unit tests
        run: pio test -e native

      # Placeholder credentials only so the firmware compiles.
      - name: Create CI secrets.h
        run: |
          sed 's/"change-me"/"ci-build-only"/' include/secrets.example.h > include/secrets.h

      - name: Build firmware
        run: pio run -e esp32dev -e esp32s3 -e esp32c3

; esp32-pelco-ptz - control a Pelco-D PTZ camera (e.g. Pelco Esprit) over RS-485
; from a web page served by an ESP32.
;
; Build/flash:  pio run -e esp32dev -t upload && pio device monitor -e esp32dev
; Unit tests:   pio test -e native

[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
    -DPTZ_BAUD=2400           ; must match the camera's DIP switches
    -DPTZ_ADDRESS=1           ; Pelco-D camera address (DIP switches)

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DPTZ_TX_PIN=17
    -DPTZ_RX_PIN=16
    -DPTZ_DE_PIN=4            ; DE+RE bridged; use -1 for auto-direction modules

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DPTZ_TX_PIN=17
    -DPTZ_RX_PIN=18
    -DPTZ_DE_PIN=8
    -DARDUINO_USB_CDC_ON_BOOT=1

; C3: avoid strapping pins 2/8/9 and USB pins 18/19
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DPTZ_TX_PIN=5
    -DPTZ_RX_PIN=4
    -DPTZ_DE_PIN=6
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:native]
platform = native
framework =
build_src_filter = +<pelco_d.cpp>
test_build_src = yes
build_flags =
